name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BroilerManager.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BroilerManager-apk
          path: BroilerManager.apk

      - name: Publish as latest release (direct download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" BroilerManager.apk \
            --title "مدير الدواجن - بناء ${{ github.run_number }}" \
            --notes "نزّل BroilerManager.apk وثبّته على الهاتف." \
            --latest
